<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypress ATV & Cycle Service | Vernon, FL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">

<header class="min-h-screen flex flex-col items-center justify-center text-center px-4 py-12 bg-black">
    <img src="48972706-9F12-4F85-A188-CA50E857E173.png" alt="Cypress Logo" class="max-w-full w-[320px] md:w-[500px] mx-auto mb-8">
    <p class="text-emerald-400 text-xl md:text-2xl mb-10">VERNON, FL • BUILT FOR THE TRAILS</p>
    <a href="tel:+18508498803" class="block w-full max-w-xs bg-emerald-600 py-4 rounded-2xl text-xl mb-4 flex items-center justify-center gap-3">📞 (850) 849-8803</a>
    <a href="#quote" class="block w-full max-w-xs bg-white text-black py-4 rounded-2xl text-xl font-semibold">GET DETAILED QUOTE</a>
    <p class="mt-12 text-sm">4046 Dorch Circle, Vernon, FL 32462</p>
</header>

<section id="quote" class="py-16 bg-zinc-900 px-4">
    <div class="max-w-md mx-auto">
        <h2 class="heading text-4xl font-bold text-center mb-10">Get Detailed Quote</h2>
        
        <select id="machine" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-5 mb-6 text-lg">
            <option value="">Select Machine Type</option>
            <option value="atv">ATV</option>
            <option value="utv">Side-by-Side (UTV)</option>
            <option value="dirtbike">Dirt Bike</option>
        </select>
        
        <textarea id="desc" rows="6" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-6 mb-6" placeholder="Describe the issue in detail..."></textarea>
        
        <button onclick="generateDetailedQuote()" class="w-full bg-emerald-600 py-5 rounded-2xl text-xl font-semibold">ANALYZE & QUOTE</button>
        
        <div id="result" class="hidden mt-12 p-8 bg-black rounded-3xl border border-emerald-700">
            <div id="details" class="space-y-4 text-zinc-300 text-sm"></div>
            <div id="grandTotal" class="text-5xl font-bold text-emerald-400 mt-10 text-center"></div>
            <a href="tel:+18508498803" class="block mt-10 w-full bg-white text-black py-5 rounded-2xl font-bold text-center">CALL TO BOOK</a>
        </div>
    </div>
</section>

<!-- Support -->
<section class="py-16 bg-black text-center px-4">
    <h2 class="heading text-4xl font-bold mb-6">Support the Shop</h2>
    <a href="https://cash.app/$StrangeDev" target="_blank" class="inline-flex items-center gap-3 bg-green-600 hover:bg-green-500 text-white text-2xl font-bold px-12 py-6 rounded-3xl">
        <i class="fab fa-cash-app"></i> $StrangeDev
    </a>
</section>

<footer class="py-10 text-center text-zinc-500 text-sm bg-black">
    © 2026 Cypress ATV & Cycle Service • Vernon, FL
</footer>

<script>
function generateDetailedQuote() {
    const machine = document.getElementById('machine').value;
    const desc = (document.getElementById('desc').value || "").toLowerCase();
    if (!machine) return alert("Please select machine type");

    let laborHours = 3;
    let partsList = [];
    let totalParts = 0;

    // Improved logic for your example (knocking + carb overflow)
    if (desc.includes("knock") || desc.includes("knocking")) {
        partsList.push("Possible piston/rings + gaskets");
        totalParts += 320;
        laborHours += 6;
    }
    if (desc.includes("carb") || desc.includes("carburetor") || desc.includes("overflow")) {
        partsList.push("Carburetor rebuild kit + overflow line + gaskets");
        totalParts += 220;
        laborHours += 4;
    }
    if (desc.includes("gasket") || desc.includes("leak")) {
        partsList.push("Full gasket set + seals");
        totalParts += 110;
        laborHours += 2;
    }

    // Default if nothing matched
    if (partsList.length === 0) {
        partsList.push("Diagnostic + common service parts");
        totalParts += 150;
    }

    laborHours = Math.max(2, Math.round(laborHours));
    const laborCost = laborHours * 125;
    const grandTotal = laborCost + totalParts;

    let html = `<p><strong>Machine:</strong> ${machine.toUpperCase()}</p>`;
    html += `<p><strong>Likely Issues:</strong> ${desc}</p><ul class="list-disc pl-5 mt-3 space-y-1">`;
    partsList.forEach(p => html += `<li>${p}</li>`);
    html += `</ul>`;
    html += `<p class="mt-6"><strong>Labor:</strong> ${laborHours} hrs @ $125/hr = $${laborCost}</p>`;
    html += `<p><strong>Parts est.:</strong> $${totalParts}</p>`;

    document.getElementById('details').innerHTML = html;
    document.getElementById('grandTotal').innerHTML = `Total Estimate: <span class="text-white">$${grandTotal}</span>`;
    document.getElementById('result').classList.remove('hidden');
}
</script>
</body>
</html>
