<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypress ATV & Cycle Service | Vernon, FL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .heading { font-family: 'Space Grotesk', sans-serif; }
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)), url('https://source.unsplash.com/random/1920x1080/?atv,dirt,trail') center/cover;
            animation: subtlePan 30s infinite alternate ease-in-out;
        }
        @keyframes subtlePan { from { background-position: 30% 50%; } to { background-position: 70% 50%; } }
        .glow { box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">

<header class="hero min-h-screen flex items-center relative">
    <div class="max-w-5xl mx-auto px-6 text-center z-10">
        <img src="48972706-9F12-4F85-A188-CA50E857E173.png" alt="Cypress Logo" class="mx-auto max-w-[650px] drop-shadow-2xl mb-8">
        <p class="text-emerald-400 text-3xl mb-10">VERNON, FL • BUILT FOR THE TRAILS</p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="tel:+18508498803" class="bg-emerald-600 hover:bg-emerald-500 px-10 py-5 rounded-2xl text-xl font-semibold flex items-center gap-3 glow">📞 (850) 849-8803</a>
            <a href="#quote" class="bg-white text-zinc-900 hover:bg-amber-300 px-10 py-5 rounded-2xl text-xl font-semibold">GET DETAILED QUOTE</a>
        </div>
        <p class="mt-10 text-lg">4046 Dorch Circle, Vernon, FL 32462</p>
    </div>
</header>

<!-- Services, Pricing sections same as before for brevity - full code would include them -->

<section id="quote" class="py-24 bg-zinc-900">
    <div class="max-w-3xl mx-auto px-6">
        <h2 class="heading text-5xl font-bold text-center mb-12">Get Detailed Repair Quote</h2>
        <div class="bg-zinc-800 rounded-3xl p-10">
            <select id="machine" class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl p-5 mb-6 text-lg">
                <option value="">Select Machine Type</option>
                <option value="atv">ATV</option>
                <option value="utv">Side-by-Side / UTV</option>
                <option value="dirtbike">Dirt Bike</option>
            </select>
            <textarea id="desc" rows="5" class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl p-6 mb-6" placeholder="Describe the issue in detail..."></textarea>
            <button onclick="generateDetailedQuote()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-2xl text-2xl font-bold">ANALYZE & QUOTE</button>

            <div id="result" class="hidden mt-10 p-8 bg-black rounded-3xl border border-emerald-700">
                <h3 class="text-2xl font-bold mb-6">Recommended Repair Estimate</h3>
                <div id="details" class="space-y-6 text-zinc-300"></div>
                <div class="mt-10 pt-8 border-t border-zinc-700">
                    <div class="text-5xl font-bold text-emerald-400" id="grandTotal">$0</div>
                    <p class="text-sm text-zinc-500">Estimate only — final after inspection</p>
                </div>
                <button onclick="window.location.href='tel:+18508498803'" class="mt-8 w-full bg-white text-zinc-900 py-6 rounded-2xl font-bold text-xl">CALL TO BOOK (850) 849-8803</button>
            </div>
        </div>
    </div>
</section>

<script>
function generateDetailedQuote() {
    const machine = document.getElementById('machine').value;
    const desc = document.getElementById('desc').value.toLowerCase();
    if (!machine) return alert("Select machine type");

    // Expanded realistic parts database
    const partsDB = [
        {term: ["engine","rebuild","knock","seize"], name: "Engine Rebuild Kit + Gaskets", cost: 650, labor: 10},
        {term: ["carb","carburetor"], name: "Carburetor Rebuild Kit", cost: 180, labor: 3.5},
        {term: ["valve","rocker"], name: "Valves + Rockers + Gaskets", cost: 280, labor: 6},
        {term: ["piston","ring"], name: "Piston + Rings + Gaskets", cost: 220, labor: 5},
        {term: ["suspension","shock","fork"], name: "Suspension / Fork Service", cost: 320, labor: 5},
        {term: ["brake"], name: "Brake Pads + Rotors", cost: 160, labor: 2.5},
        {term: ["belt","cv"], name: "CV Belt + Rollers", cost: 130, labor: 2},
        {term: ["gasket","seal"], name: "Full Gasket Set", cost: 95, labor: 4}
    ];

    let totalLabor = 3;
    let totalParts = 0;
    let breakdown = [];

    partsDB.forEach(item => {
        if (item.term.some(t => desc.includes(t))) {
            totalLabor += item.labor;
            totalParts += item.cost;
            breakdown.push(`• ${item.name}: $${item.cost} parts + ${item.labor} hrs labor`);
        }
    });

    totalLabor = Math.max(2, Math.round(totalLabor));
    const laborCost = totalLabor * 125;
    const grandTotal = laborCost + totalParts;

    let html = `<p class="font-medium">Machine: ${machine.toUpperCase()}</p>`;
    html += `<p class="mt-4">Likely repairs based on description:</p><div class="mt-3 space-y-2">${breakdown.join('<br>') || '• General inspection + service recommended'}</div>`;
    html += `<p class="mt-6">Labor: ${totalLabor} hrs @ $125/hr = $${laborCost}</p>`;
    html += `<p>Parts: $${totalParts}</p>`;

    document.getElementById('details').innerHTML = html;
    document.getElementById('grandTotal').textContent = '$' + grandTotal;
    document.getElementById('result').classList.remove('hidden');
}
</script>
</body>
</html>
